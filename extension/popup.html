<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Lazy Hands</title>
    <style>
      body {
        margin: 0;
        width: 280px;
        background: #efe2cc;
        color: #3b2a1c;
        font: 14px/1.4 "Iowan Old Style", Palatino, Georgia, serif;
        padding: 14px 16px 16px;
      }
      h1 {
        font-style: italic;
        font-size: 1.5rem;
        margin: 0 0 0.35rem;
      }
      p { margin: 0 0 0.6rem; }
      button {
        background: #b64a28;
        color: #fbf3e4;
        border: 0;
        padding: 0.4rem 0.7rem;
        font: inherit;
        margin-right: 0.4rem;
      }
      .lamp { font-size: 12px; letter-spacing: 0.12em; text-transform: uppercase; color: #6a4024; }
      a { color: #8a341c; }
    </style>
  </head>
  <body>
    <h1>Lazy Hands</h1>
    <p>Camera stays on this machine. A short palm toggles the main video. A held thumb approves.</p>
    <p class="lamp" id="lamp">Lamp idle</p>
    <p>
      <button id="start" type="button">Wake the camera</button>
      <button id="stop" type="button">Rest</button>
    </p>
    <p>Bridge: <code>127.0.0.1:4537</code></p>
    <p>Then <code>lazyhands approve -- echo hi</code></p>
    <script src="dist/popup.js"></script>
  </body>
</html>
